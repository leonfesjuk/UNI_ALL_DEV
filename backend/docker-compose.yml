version: "3.9"

services:
  backend:
    build:
      context: ./
      dockerfile: api/Dockerfile  # Вказуємо на Dockerfile всередині папки api
    container_name: backend-backend-1
    ports:
      - "8000:8000"
    volumes:
      - ./:/app/backend # Маппінг директорії api на контейнер
      - ../backend_forecasting:/app/forecasting
      - /data/models/kronos2:/app/forecasting/models/kronos2:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/forecasting:/app/backend
      - FC_CONFIG=config/production.yml
    command: hypercorn api.main:app --bind 0.0.0.0:8000
    restart: always
    networks:
      - app-network

  frontend:
    build:
      context: ../frontend  # Вказуємо шлях до frontend на один рівень вище
      dockerfile: Dockerfile  # Dockerfile для фронтенду
    ports:
      - "5000:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro  
    restart: always
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile  # Dockerfile для Nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  # Налаштування для Nginx
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro        
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
networks:
  app-network:
    driver: bridge