<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Auto Order Dashboard</title>
    
    <!-- Bootstrap CSS -->
    <link href="../static/style/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="../static/style/style.css" rel="stylesheet">
    <!-- Font Awesome for menu icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar section -->
        <div class="sidebar">
            <!-- Menu button -->
            <button id="menuToggle" class="btn btn-primary mt-2 mb-2">
                <i class="fas fa-bars"></i> Menu
            </button>

            <!-- Slide-out menu -->
            <div id="slideMenu" class="slide-menu">
                <ul class="list-unstyled">
                    <li><a href="#" class="active">Auto Order Warehouse</a></li>
                    <li><a href="#">Auto Order Markets</a></li>
                    <li><a href="#">Dashboard</a></li>
                    <li><a href="#">Forecasts</a></li>
                </ul>
            </div>

            <!-- Auto Order controls -->
            <div class="mt-4">
                <h5 class="text-primary">Auto Order</h5>
                <div class="date-picker">
                    <h6>Start Date</h6>
                    <input type="date" id="dateStart" class="form-control">
                    <h6>End Date</h6>
                    <input type="date" id="dateEnd" class="form-control">
                    <p id="finishDateValidation">Database updated through yesterday.</p>
                    <h6>Days of Order</h6>
                    <input type="number" id="daysOfOrder" class="form-control" min="7" value="7">
                </div>
                <button id="startAutoOrderBtn" class="btn btn-primary mt-3">Start Auto Order</button>
            </div>

            <!-- Analysis information panel -->
            <div class="info-panel mt-auto">
                <h6>Analysis Information</h6>
                <p>Time spent: <span id="analysisTime">0.00</span> seconds</p>
                <p>Products analyzed: <span id="productCount">0</span></p>
            </div>
        </div>

        <!-- Main content area -->
        <div class="main-panel">
            <div class="content">
                <div class="row">
                    <div class="col-md-12">
                        <!-- Status message containers -->
                        <div class="mt-4">
                            <div id="status" class="alert alert-info" style="display: none;"></div>
                            <div id="result" class="alert alert-success" style="display: none;"></div>
                            <div id="error" class="alert alert-danger" style="display: none;"></div>
                        </div>

                        <!-- Product table card -->
                        <div class="card">
                            <div class="card-header">
                                <h4 class="card-title">Auto Order Results</h4>
                                <div class="download-buttons">
                                    <button class="btn btn-primaryn download-button" id="download-mid-button" style="display: none;"">Download test table</button>
                                    <button class="btn btn-primaryn download-button" id="download-result-button" style="display: none;"">Download table</button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-striped">
                                        <thead id="tableHeader"></thead>
                                        <tbody id="productTable"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="../static/js/bootstrap.min.js"></script>

    <!-- jQuery -->
    <script src="../static/js/jquery-3.7.1.min.js"></script>
    
    <!-- Excel file downloader-->
    <script src="../static//js/xlsx.full.min.js"></script>

    <!-- Custom JS -->
    <script src="../static/js/script.js" defer></script>
</body>
</html>
