# Визначення upstream для фронтенду та бекенду
upstream gui {
    server frontend:80;  # Проксі для фронтенду
}

upstream api {
    server backend:8000;  # Проксі для бекенду (API)
}

server {
    listen 80;
    server_name _;  # Прив'язуємо домен до цього сервера

    location / {
        proxy_pass http://frontend:80;  # Проксування до фронтенду
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        send_timeout 1200s;
        client_max_body_size 50M;
    }

    location /api/ {
        proxy_pass http://backend:8000/;  # Проксування до бекенду (API)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        send_timeout 1200s;
        client_max_body_size 50M;
    }
}